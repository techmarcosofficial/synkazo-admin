# Example docker-compose service block for the DEV server.
#
# This is a FRAGMENT, not a standalone file. Merge the `synkazo-admin`
# block below into the merged ~/synkazo/docker-compose.yml on the server
# (same file the frontend and api examples merge into) — don't create a
# second compose file.
#
# The GitHub Actions workflow (.github/workflows/deploy-dev.yml) runs
# `docker compose build synkazo-admin` + `docker compose up -d` from
# $DEPLOY_BASE_PATH (a repo/org Actions variable — see synkazo-docs), so
# this fragment needs to live in the compose file there — NOT inside the
# app directory. In this repo's real deploy stack that file is
# synkazo-docs/docker-compose.dev.yml, which already has the equivalent
# `synkazo-admin` service — this fragment exists for documentation/manual
# use, not because it's wired into CI.
#
# The workflow SCPs the app tarball to $DEPLOY_BASE_PATH/admin.tar.gz and
# extracts it to $DEPLOY_BASE_PATH/synkazo-admin-dev/, which is what
# `build.context` below points at. No env_file at runtime — this is a
# static Vite SPA served by nginx.
#
# VITE_* values are baked into the client bundle at `vite build` time
# (Vite exposes any process.env var prefixed with VITE_ via
# import.meta.env), so they must be supplied via build.args below — not
# env_file/environment, which only affect the (nonexistent, here) runtime
# process and cannot change JS already compiled into /dist. See
# synkazo-docs/docs/Admin_Environment_Variables.md.

services:
  synkazo-admin:
    container_name: synkazo_dev_admin
    build:
      context: ./synkazo-admin-dev
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://dev-api.synkazo.com/api}
        VITE_FRONTEND_URL: ${VITE_FRONTEND_URL:-https://dev.synkazo.com}
        VITE_STRIPE_PUBLISHABLE_KEY: ${VITE_STRIPE_PUBLISHABLE_KEY:-}
    image: synkazo/admin:dev
    restart: unless-stopped
    ports:
      # host:container — bind to loopback only; front with nginx / Caddy /
      # Cloudflare Tunnel for public access. Change if 5001 collides with
      # something else already running on this host.
      - "127.0.0.1:5001:80"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
