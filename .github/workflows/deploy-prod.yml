name: Deploy Admin — Prod

on:
  push:
    branches:
      - prod

concurrency:
  group: deploy-admin-prod
  cancel-in-progress: true

env:
  DEPLOY_BASE_PATH: ${{ vars.DEPLOY_BASE_PATH }}

jobs:
  deploy:
    name: Deploy Admin to Prod Server
    runs-on: ubuntu-latest

    steps:
      - name: Validate required configuration
        run: |
          if [ -z "${DEPLOY_BASE_PATH}" ]; then
            echo "::error::Repo/org variable DEPLOY_BASE_PATH is not set (Settings -> Secrets and variables -> Actions -> Variables). It must be the absolute path to the synkazo directory on the target server, e.g. /home/techmarcos/synkazo."
            exit 1
          fi

      - name: Checkout Latest Code
        uses: actions/checkout@v4

      - name: Create Deployment Archive
        run: |
          tar \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='dist' \
            --exclude='coverage' \
            --exclude='.env' \
            --exclude='.env.local' \
            -czf /tmp/admin.tar.gz .
          mv /tmp/admin.tar.gz admin.tar.gz

      - name: Upload Archive via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          source: "admin.tar.gz"
          target: "${{ vars.DEPLOY_BASE_PATH }}/"
          overwrite: true

      - name: Extract, Build & Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          envs: DEPLOY_BASE_PATH
          script: |
            set -e
            cd "${DEPLOY_BASE_PATH}"

            # Preserve every .env* file across the fresh extract — Vite bakes
            # VITE_* vars in at build time by reading these directly, no
            # Docker build ARGs involved (see synkazo-admin/Dockerfile). Backs
            # up whatever's actually there (.env, .env.production, etc.)
            # instead of naming one file, so nothing gets silently deleted.
            ENV_BACKUP_DIR=$(mktemp -d)
            cp synkazo-admin-prod/.env* "$ENV_BACKUP_DIR"/ 2>/dev/null || true

            rm -rf synkazo-admin-prod
            mkdir -p synkazo-admin-prod
            tar -xzf admin.tar.gz -C synkazo-admin-prod
            rm -f admin.tar.gz

            cp "$ENV_BACKUP_DIR"/.env* synkazo-admin-prod/ 2>/dev/null || true
            rm -rf "$ENV_BACKUP_DIR"

            # Remove old / previously-named containers
            for c in synkazo-admin synkazo_admin synkazo_prod_admin; do
              docker stop $c 2>/dev/null || true
              docker rm $c 2>/dev/null || true
            done

            # The live stack definition lives in synkazo-docs, not this repo —
            # see synkazo-docs/docker-compose.prod.yml.
            COMPOSE_FILE="${DEPLOY_BASE_PATH}/synkazo-docs/docker-compose.prod.yml"
            if [ ! -f "$COMPOSE_FILE" ]; then
              echo "::error::$COMPOSE_FILE not found — deploy synkazo-docs to prod first."
              exit 1
            fi

            docker compose -f "$COMPOSE_FILE" build synkazo-admin
            docker compose -f "$COMPOSE_FILE" up -d --no-deps synkazo-admin

            echo "Waiting for container to start..."
            sleep 5
            if ! docker ps | grep -q "synkazo_prod_admin"; then
              echo "ERROR: synkazo_prod_admin failed to start"
              docker logs --tail=50 synkazo_prod_admin || true
              exit 1
            fi
            echo "Deploy successful"

            docker image prune -f
